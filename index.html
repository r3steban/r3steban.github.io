<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>r3steban</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #F7F4F2;
            color: #2A2226;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        main { width: 100%; max-width: 480px; }

        h1 { font-size: 1.8rem; margin-bottom: 4px; }
        p { color: #7A6E73; margin-bottom: 28px; }

        ul { list-style: none; display: grid; gap: 14px; }

        a {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            background: #fff;
            border: 1px solid #ECE5E8;
            border-left: 4px solid #EA0558;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: transform .15s ease, box-shadow .15s ease;
        }
        a:hover { transform: translateX(4px); box-shadow: 0 6px 18px rgba(234, 5, 88, .12); }

        .icon { font-size: 1.8rem; }
        strong { display: block; }
        small { color: #7A6E73; }
    </style>
</head>
<body>
    <main>
        <h1>✨ Proyectos</h1>
        <p>Cositas navideñas para el equipo.</p>
        <ul>
            <li>
                <a href="civiamigo/">
                    <span class="icon">🎁</span>
                    <span><strong>CiviAmigo</strong><small>Amigo Invisible 2025</small></span>
                </a>
            </li>
            <li>
                <a href="civiloteria2026/">
                    <span class="icon">🎟️</span>
                    <span><strong>CiviLotería 2026</strong><small>Lotería de Navidad · Tecnología</small></span>
                </a>
            </li>
        </ul>
    </main>
</body>
</html>
